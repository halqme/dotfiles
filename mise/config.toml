[settings]
dotfiles.root = "~/.dotfiles"

[bootstrap.mise_shell_activate]
zsh = true

[dotfiles]
"~/.zshenv/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"' }
"~/.gitignore_global" = { source = "~/.dotfiles/config/.gitignore_global", mode = "symlink" }
"~/.tmux.conf" = { source = "~/.dotfiles/config/tmux.conf", mode = "symlink" }
"~/.vimrc" = { source = "~/.dotfiles/config/vim/vimrc", mode = "symlink" }
"~/.hushlogin" = { source = "~/.dotfiles/config/zsh/.hushlogin", mode = "symlink" }
"~/.config/bunfig.toml" = { source = "~/.dotfiles/config/bun/bunfig.toml", mode = "symlink" }
"~/.config/ghostty" = { source = "~/.dotfiles/config/ghostty", mode = "symlink" }
"~/.config/nvim" = { source = "~/.dotfiles/config/nvim", mode = "symlink" }
"~/.config/wezterm" = { source = "~/.dotfiles/config/wezterm", mode = "symlink" }
"~/.config/zed" = { source = "~/.dotfiles/config/zed", mode = "symlink" }
"~/.config/zsh/.p10k.zsh" = { source = "~/.dotfiles/config/zsh/.p10k.zsh", mode = "symlink" }
"~/.config/zsh/zprofile.zsh" = { source = "~/.dotfiles/config/zsh/zprofile.zsh", mode = "symlink" }
"~/.config/zsh/zshrc.zsh" = { source = "~/.dotfiles/config/zsh/zshrc.zsh", mode = "symlink" }
"~/.config/zsh/common" = { source = "~/.dotfiles/config/zsh/common", mode = "symlink" }
"~/.config/zsh/lib" = { source = "~/.dotfiles/config/zsh/lib", mode = "symlink" }
"~/.config/zsh/plugins" = { source = "~/.dotfiles/config/zsh/plugins", mode = "symlink" }
"~/.zprofile/zsh-config" = { block = '''
export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
source "$XDG_CONFIG_HOME/zsh/zprofile.zsh"
''' }
"~/.zshrc/zsh-config" = { block = 'source "${XDG_CONFIG_HOME:-$HOME/.config}/zsh/zshrc.zsh"' }
"~/.config/age/recipient.txt" = { source = "~/.dotfiles/config/age/recipient.txt", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "~/.dotfiles/mise/config.toml", mode = "symlink" }
"~/.config/mise/miserc.toml" = { source = "~/.dotfiles/mise/miserc.toml", mode = "symlink" }
"~/.config/mise/config.macos.toml" = { source = "~/.dotfiles/mise/config.macos.toml", mode = "symlink" }
"~/.config/mise/config.linux.toml" = { source = "~/.dotfiles/mise/config.linux.toml", mode = "symlink" }

[env]
BUN_INSTALL = "{{ env.HOME }}/.bun"
DENO_HOME = "{{ env.HOME }}/.deno"
PNPM_HOME = "{{ env.HOME }}/.pnpm"
GOPATH = "{{ env.HOME }}/.go"
MODULAR_HOME = "{{ env.HOME }}/.modular"
GHQ_ROOT = "{{ env.HOME }}/Projects"
_ZO_DATA_DIR = "{{ env.HOME }}/.local/share"
OLLAMA_FLASH_ATTENTION = "1"
OLLAMA_CONTEXT_LENGTH = "64000"
