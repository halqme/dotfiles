# macOS development tool defaults and Homebrew bootstrap packages.
# GUI applications and fonts are managed by ../config/homebrew/Brewfile via `brew bundle`.

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.config/karabiner" = { source = "~/.dotfiles/config/karabiner", mode = "symlink" }
"~/.config/home-manager" = { source = "~/.dotfiles/config/home-manager", mode = "symlink" }
"~/.config/nix" = { source = "~/.dotfiles/config/nix", mode = "symlink" }
"~/.config/zsh/platform" = { source = "~/.dotfiles/config/zsh/darwin", mode = "symlink" }
"~/.config/jj/config.toml" = { source = "~/.dotfiles/config/jj/config.toml", mode = "symlink" }
"~/.config/nushell" = { source = "~/.dotfiles/config/nushell", mode = "symlink" }
"~/.config/homebrew/Brewfile" = { source = "~/.dotfiles/config/homebrew/Brewfile", mode = "symlink" }

# macOS user defaults. Applied explicitly with `mise bootstrap macos defaults apply`.
[bootstrap.macos.dock]
autohide = true
tilesize = 40
show_recents = false
mru_spaces = true

[bootstrap.macos.finder]
show_all_files =  true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "column"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
fn_state = true

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[tools]
go = "latest"
nim = "latest"
zig = "0.17.0"

aube = "latest"

[bootstrap.packages]
"brew:age" = "latest"
"brew:aria2" = "latest"
"brew:bottom" = "latest"
"brew:dust" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:ffmpeg" = "latest"
"brew:fzf" = "latest"
"brew:fzf-tab" = "latest"
"brew:gat" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git-delta" = "latest"
"brew:htop" = "latest"
"brew:just" = "latest"
"brew:lazygit" = "latest"
"brew:neovim" = "latest"
"brew:nushell" = "latest"
"brew:powerlevel10k" = "latest"
"brew:ripgrep" = "latest"
"brew:yazi" = "latest"
"brew:zoxide" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-completions" = "latest"
"brew:zsh-fast-syntax-highlighting" = "latest"

[tasks.bootstrap]
description = "Post-bootstrap machine setup"
run = '''
set -euo pipefail

if [[ "$(uname -s)" == "Darwin" ]]; then
  brew bundle install --file "$HOME/.config/homebrew/Brewfile"
fi
'''
