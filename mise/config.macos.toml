# macOS development tool defaults, bootstrap packages, and settings.

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.config/karabiner" = { source = "~/.dotfiles/config/karabiner", mode = "symlink" }
"~/.config/zsh/platform" = { source = "~/.dotfiles/config/zsh/darwin", mode = "symlink" }
"~/.config/jj/config.toml" = { source = "~/.dotfiles/config/jj/config.toml", mode = "symlink" }
"~/.config/nushell" = { source = "~/.dotfiles/config/nushell", mode = "symlink" }
"~/.config/nix" = { source = "~/.dotfiles/config/nix", mode = "symlink" }
"~/.config/direnv/direnv.toml" = { source = "~/.dotfiles/config/direnv/direnv.toml", mode = "symlink" }
"~/.config/direnv/direnvrc" = { source = "~/.dotfiles/config/direnv/direnvrc", mode = "symlink" }
"~/.ssh/config" = { source = "~/.dotfiles/config/ssh/config", mode = "symlink" }
"~/.gitconfig/darwin" = { block = '''
[include]
    path = ~/.config/git/darwin.gitconfig
''' }
"~/.config/git/darwin.gitconfig" = { source = "~/.dotfiles/config/git/darwin.gitconfig", mode = "symlink" }

# macOS user defaults. Applied explicitly with `mise bootstrap macos defaults apply`.
[bootstrap.macos.dock]
autohide = true
tilesize = 40
show_recents = false
mru_spaces = true

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "column"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
fn_state = true

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[tools]
go = "latest"
zig = "0.17.0"
ruby = "latest"

direnv = "latest"
neovim = "stable"
nushell = "latest"
ripgrep = "latest"

aube = "latest"

[bootstrap.packages]
"brew:age" = "latest"
"brew:bottom" = "latest"
"brew:dust" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
